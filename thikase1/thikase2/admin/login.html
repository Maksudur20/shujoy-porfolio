<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Studio Security Gate | Farhan Shujoy</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07080c;
      --card-bg: rgba(18, 22, 34, 0.78);
      --border: rgba(255, 255, 255, 0.09);
      --primary: #ff9e00;
      --primary-glow: rgba(255, 158, 0, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 158, 0, 0.16) 0%, transparent 70%);
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { top: -100px; left: -100px; }
    .glow-2 { bottom: -100px; right: -100px; background: radial-gradient(circle, rgba(255, 110, 0, 0.12) 0%, transparent 70%); }

    /* Login Box Container */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.8rem 2.2rem;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 158, 0, 0.08);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      font-weight: 700;
      color: var(--primary);
      padding: 0.35rem 0.85rem;
      background: rgba(255, 158, 0, 0.1);
      border: 1px solid rgba(255, 158, 0, 0.25);
      border-radius: 999px;
      margin-bottom: 1.4rem;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    /* Form */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: left;
      margin-bottom: 1.5rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: rgba(9, 11, 16, 0.9);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      padding-right: 3rem;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: all 0.25s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 16px var(--primary-glow);
      background: rgba(14, 18, 28, 0.95);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.15rem;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .toggle-pass-btn:hover {
      color: #fff;
    }

    .btn-submit {
      width: 100%;
      padding: 0.95rem;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff9e00 0%, #ff6b00 100%);
      color: #000;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 158, 0, 0.35);
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(255, 158, 0, 0.6);
    }
    .btn-submit:active {
      transform: translateY(0);
    }

    /* Error Alert */
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }
    .error-msg.show {
      display: flex;
      animation: shake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
      40%, 60% { transform: translate3d(3px, 0, 0); }
    }

    .footer-note {
      margin-top: 1.8rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }
    .footer-note a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="login-container">
    <div class="brand-badge">
      <div class="badge-dot"></div>
      <span>Private Studio Gate</span>
    </div>

    <h1>Security Access</h1>
    <p class="subtitle">Enter your admin password to access the Portfolio Customizer Studio.</p>

    <div class="error-msg" id="errorMsg">
      <span>⚠️</span>
      <span id="errorText">Incorrect password! Please try again.</span>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="passwordInput">Admin Password</label>
        <div class="input-wrapper">
          <input type="password" id="passwordInput" placeholder="Enter password..." required autofocus>
          <button type="button" class="toggle-pass-btn" id="togglePassBtn" title="Show/Hide Password">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>🔐 Authorize & Enter</span>
      </button>
    </form>

    <div class="footer-note">
      Farhan Shujoy Portfolio System • <a href="../../../index.html">Back to Site</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const input = document.getElementById('passwordInput');
    const errorMsg = document.getElementById('errorMsg');
    const toggleBtn = document.getElementById('togglePassBtn');

    // Toggle Password Visibility
    toggleBtn.addEventListener('click', () => {
      const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
      input.setAttribute('type', type);
      toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // Form Submit Authentication
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const enteredPassword = input.value.trim();
      if (!enteredPassword) return;

      errorMsg.classList.remove('show');

      let isValid = false;

      // 1. Try server API login
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: enteredPassword })
        });
        if (response.ok) {
          const data = await response.json();
          if (data.success) {
            isValid = true;
          }
        }
      } catch (err) {
        // Fallback for static hosts (GitHub Pages / Vercel)
      }

      // 2. Client-side fallback check (for static hosting or local file mode)
      if (!isValid) {
        let expectedPassword = 'thikase'; // Default fallback

        // Check localStorage custom config
        try {
          const localData = localStorage.getItem('site_config_data');
          if (localData) {
            const parsed = JSON.parse(localData);
            if (parsed.auth && parsed.auth.adminPassword) {
              expectedPassword = parsed.auth.adminPassword;
            }
          } else {
            // Fetch site-config.json
            const cfgRes = await fetch('../../../site-config.json');
            if (cfgRes.ok) {
              const cfg = await cfgRes.json();
              if (cfg.auth && cfg.auth.adminPassword) {
                expectedPassword = cfg.auth.adminPassword;
              }
            }
          }
        } catch (e) {}

        if (enteredPassword === expectedPassword) {
          isValid = true;
        }
      }

      if (isValid) {
        // Store authenticated session
        sessionStorage.setItem('shujoy_admin_auth', 'authenticated');
        sessionStorage.setItem('shujoy_auth_time', Date.now().toString());

        // Redirect to admin studio
        window.location.href = '../../../admin.html';
      } else {
        errorMsg.classList.add('show');
        input.select();
      }
    });
  </script>
</body>
</html>
